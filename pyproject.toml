[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cronical"
version = "0.1.0"
description = "Explainable AI decision support for diabetes risk review (educational prototype, not a diagnostic tool)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
    "explainable-ai",
    "shap",
    "clinical-decision-support",
    "diabetes",
    "machine-learning",
    "fastapi",
    "streamlit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]

# Core dependencies are deliberately minimal: configuration and logging only.
# Every heavy dependency is optional so that a fresh clone can run its tests
# without a multi-minute install.
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
# Tabular foundations for loading and cleaning the dataset.
data = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
]
# Leakage-safe feature preparation. Needed by anything that consumes features,
# so it is separate from `data` (which only reads and validates).
preprocessing = [
    "scikit-learn>=1.5",
    "joblib>=1.4",
]
# Estimators and imbalance handling. Includes preprocessing, because a model is
# meaningless without the fitted pipeline that prepared its training features.
ml = [
    "cronical[preprocessing]",
    "imbalanced-learn>=0.12",
    "xgboost>=2.0",
]
# Plots for the evaluation report.
reporting = [
    "matplotlib>=3.8",
]
# Post-hoc explanation engines.
explainability = [
    "shap>=0.46",
    "lime>=0.2.0.1",
    "matplotlib>=3.8",
]
# FastAPI backend.
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]
# Streamlit clinician dashboard.
ui = [
    "streamlit>=1.37",
    "plotly>=5.22",
]
# Interactive development and notebook execution.
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
dev = [
    "cronical[data,preprocessing,ml,reporting]",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # scikit-learn ships no py.typed marker, so mypy --strict needs the
    # community stubs to type-check code that constructs its estimators.
    "scikit-learn-stubs>=0.0.3",
    "pre-commit>=3.8",
]
all = [
    "cronical[data,preprocessing,ml,explainability,reporting,api,ui,notebooks,dev]",
]

[project.urls]
Repository = "https://github.com/OmkarPanchal06/cronical"
Issues = "https://github.com/OmkarPanchal06/cronical/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/cronical"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/api",
    "/app",
    "/notebooks",
    "/pyproject.toml",
    "/README.md",
    "/requirements.txt",
]

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Allows `pytest` to work from a bare clone, before an editable install.
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=cronical",
    "--cov-report=term-missing",
    "--cov-report=xml",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cronical"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# The package docstrings and re-export modules are covered by the import tests.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "api", "app"]
extend-exclude = ["notebooks", ".venv", "models"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "A",    # builtin shadowing
    "C4",   # comprehensions
    "SIM",  # simplify
    "PTH",  # use pathlib instead of os.path
    "RUF",  # ruff-specific rules
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "TID",  # tidy imports
    "ARG",  # unused arguments
]
ignore = [
    "D203",   # incompatible with D211 (no blank line before class docstring)
    "D213",   # incompatible with D212 (summary on first line)
    "ANN401", # `Any` is permitted where a schema is genuinely dynamic
    "D107",   # __init__ docstrings are covered by the class docstring
    "COM812", # handled by ruff format
]

[tool.ruff.lint.per-file-ignores]
# Test classes group related cases; pytest passes fixtures as keyword arguments
# rather than through `self`, and docstrings on each case add little.
"tests/*" = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "ANN001",
    "ANN201",
    "ANN202",
    "ARG001",
    "ARG002",
]
"notebooks/*" = ["D", "ANN", "E402", "B008", "ARG"]
# scikit-learn's API mandates these names: it inspects the signatures of `fit`,
# `transform` and `fit_transform`, so `X`, `y`, `X_train` and `X_test` cannot be
# renamed to lowercase without breaking the estimator contract. The unused `y`
# parameter is likewise required: the pipeline always passes it.
"src/cronical/data/preprocessing.py" = ["N803", "N806", "ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
# Relative imports above the parent package break reusable packaging.
ban-relative-imports = "parents"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true
show_error_codes = true
pretty = true
exclude = ["^notebooks/"]

[[tool.mypy.overrides]]
# Neither pandas nor joblib ships a py.typed marker, so mypy would otherwise skip
# them and silently treat every DataFrame and dump() call as Any. Following the
# untyped import makes mypy read their own inline annotations instead.
module = ["pandas", "pandas.*", "joblib", "joblib.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
# Tests are checked, but not held to the full strict bar: parametrised cases and
# pytest fixtures are often more readable without exhaustive annotations.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_unused_ignores = false
